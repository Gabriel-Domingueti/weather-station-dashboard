server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri /index.html;
    }

    # Em produção via docker-compose local, encaminha /api pro backend.
    # Em deploy real (Render/Railway), o front normalmente chama o backend
    # por URL absoluta (VITE_API_BASE_URL) e este bloco pode ser removido.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
    }
}
